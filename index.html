<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Prediction</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Customer Churn Prediction</h2>
        <form action="/predict" method="POST">
            <label>Gender:</label>
            <select name="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label>Senior Citizen (0 = No, 1 = Yes):</label>
            <input type="number" name="senior" min="0" max="1" required>

            <label>Tenure (months):</label>
            <input type="number" name="tenure" required>

            <label>Monthly Charges:</label>
            <input type="number" name="monthly_charges" required>

            <label>Total Charges:</label>
            <input type="number" name="total_charges" required>

            <label>Contract:</label>
            <select name="contract">
                <option value="Month-to-month">Month-to-month</option>
                <option value="One year">One year</option>
                <option value="Two year">Two year</option>
            </select>

            <label>Payment Method:</label>
            <select name="payment_method">
                <option value="Electronic check">Electronic check</option>
                <option value="Mailed check">Mailed check</option>
                <option value="Bank transfer (automatic)">Bank transfer</option>
                <option value="Credit card (automatic)">Credit card</option>
            </select>

            <button type="submit">Predict Churn</button>
        </form>
    </div>
</body>
</html>
